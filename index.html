<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tardy Slip</title>
  <style>
    @page {
      size: 80mm auto;
      margin: 0;
    }
    body {
      font-family: 'Courier New', Courier, monospace;
      width: 72mm;
      margin: 0 auto;
      padding: 10px 0;
      font-size: 15px; /* Bumped base font size */
      color: #000;
    }
    .text-center { text-align: center; }
    .divider { border-bottom: 2px dashed #000; margin: 12px 0; }
    .field { margin: 10px 0; }
    .label { font-weight: bold; font-size: 13px; text-transform: uppercase; } /* Larger, bolder label */
    .value { font-size: 17px; font-weight: bold; margin-top: 3px; } /* Larger, bold field values */
  </style>
</head>
<body>

  <div class="text-center">
    <h2 style="margin: 0; font-size: 22px;">RAYBURN MS TARDY SLIP</h2>
  </div>

  <div class="divider"></div>

  <div class="field">
    <div class="label">Date & Time:</div>
    <div class="value" id="datetime">--</div>
  </div>

  <div class="field">
    <div class="label">Student:</div>
    <div class="value" id="student">--</div>
  </div>

  <div class="field">
    <div class="label">Teacher:</div>
    <div class="value" id="teacher">--</div>
  </div>

  <div class="field">
    <div class="label">Room:</div>
    <div class="value" id="room">--</div>
  </div>

  <div class="divider"></div>
  <p class="text-center" style="font-size: 13px; font-weight: bold;">Please admit student to class.</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    
    document.getElementById('datetime').innerText = params.get('time') || 'N/A';
    document.getElementById('student').innerText = params.get('student') || 'N/A';
    document.getElementById('teacher').innerText = params.get('teacher') || 'N/A';
    document.getElementById('room').innerText = params.get('room') || 'N/A';

    window.onload = function() {
      setTimeout(() => {
        window.print();
      }, 500);
    };
  </script>
</body>
</html>
